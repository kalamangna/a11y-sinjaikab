<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>A11y Widget Standalone Production Demo</title>
  <style>
    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      margin: 0;
      padding: 40px 20px;
      background: #f1f5f9;
      color: #334155;
    }
    .wrapper {
      max-width: 800px;
      margin: 0 auto;
      background: white;
      padding: 32px;
      border-radius: 12px;
      box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1);
    }
    h1 { color: #1e293b; }
    .box-anim {
      width: 50px;
      height: 50px;
      background: #3b82f6;
      border-radius: 8px;
      animation: spin 3s infinite linear;
      margin: 20px 0;
    }
    @keyframes spin { 100% { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <div class="wrapper">
    <h1>Contoh Integrasi Produksi Standalone</h1>
    <p>Halaman ini memuat langsung <code>dist/widget.min.js</code> tanpa framework atau dev server.</p>
    <p>Silakan uji tombol aksesibilitas di pojok kanan bawah.</p>
    <div class="box-anim"></div>
    <p><a href="#">Tautan Contoh untuk Pengujian</a></p>
  </div>

  <!-- Cukup 1 baris script ini saja: -->
  <script src="./widget.min.js" data-position="bottom-right" data-lang="id" defer></script>
</body>
</html>
